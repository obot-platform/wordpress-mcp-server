name: Build and Push Docker Image
permissions:
  id-token: write
  contents: read
  packages: write
  actions: read
  security-events: write
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
jobs:
  docker-build:
    runs-on: depot-ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Depot
        uses: depot/setup-action@v1
      - name: Build Docker image
        uses: depot/build-push-action@v1
        with:
          project: bbqjs4tj1g
          context: .
          pull: true
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/wordpress-mcp-image.tar
      - name: Unpack image for scanning and publishing
        run: |
          mkdir -p "$RUNNER_TEMP/image-layout"
          tar -xf "$RUNNER_TEMP/wordpress-mcp-image.tar" -C "$RUNNER_TEMP/image-layout"
      - name: Select images for scanning
        run: |
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            python3 .github/scripts/select-oci-platform.py \
              "$RUNNER_TEMP/image-layout" "$platform" "$RUNNER_TEMP/image-${arch}"
          done
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.68.2
      - name: Run Trivy
        run: |
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            trivy image --input "$RUNNER_TEMP/image-${arch}" \
              --skip-dirs '**/venv' --format sarif --output "trivy-results-${arch}.sarif"
          done
      - name: Upload amd64 SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-amd64.sarif
          category: amd64
      - name: Upload arm64 SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-arm64.sarif
          category: arm64
      - name: Enforce vulnerability policy
        run: |
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            trivy image --input "$RUNNER_TEMP/image-${arch}" \
              --skip-dirs '**/venv' --format table --severity HIGH,CRITICAL --exit-code 1
          done
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4
      - name: Push scanned image
        id: push
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          image_ref=$(crane push --index "$RUNNER_TEMP/image-layout" "$IMAGE_TAG")
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
      - name: Copy image to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          crane tag "$IMAGE_REF" latest
