name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v

  container:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: docker build -t wordpress-mcp:test .
      - run: uv run --frozen python -m unittest discover -s tests -p test_container.py -v
        env:
          WORDPRESS_TEST_IMAGE: wordpress-mcp:test
