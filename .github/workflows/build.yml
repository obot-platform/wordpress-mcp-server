name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests
      - name: Verify container MCP endpoint
        run: |
          docker build -t wordpress-mcp-path-test .
          docker run --rm -d --name wordpress-mcp-path-test \
            -p 127.0.0.1:18099:8099 \
            -e WORDPRESS_SITE=https://example.com \
            -e WORDPRESS_USERNAME=test-user \
            -e WORDPRESS_PASSWORD=test-password \
            wordpress-mcp-path-test
          trap 'docker stop wordpress-mcp-path-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18099/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          response=$(curl --fail-with-body -sS http://127.0.0.1:18099/mcp \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"path-test","version":"1"}}}')
          jq -e '.result.protocolVersion == "2025-03-26"' <<< "$response"
